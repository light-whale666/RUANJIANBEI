# 示例：待系统 Nginx 就绪后启用。不要把 5432/6379/9000 对公网开放，
# 不要改 chatgpt-lite(8080) 与 ollama(11435)，不要覆盖 /opt/campus-assistant/.env。
#
# 部署静态文件：将 admin/dist 内全部文件复制到 /opt/campus-assistant/www/admin/
#   rsync -a --delete dist/ root@8.148.186.220:/opt/campus-assistant/www/admin/
#
# 本文件建议放到 /etc/nginx/sites-available/campus-assistant 并 ln -s 到 sites-enabled。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.148.186.220 _;

    client_max_body_size 50m;

    # 管理后台（Vue history 模式）
    root /opt/campus-assistant/www;
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location = /admin {
        return 302 /admin/;
    }

    # 业务 API：后端仅绑定 127.0.0.1:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
}
