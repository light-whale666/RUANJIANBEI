name: campus_assistant
description: 师生共用的校园办事与入学助手
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  intl: any
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  path: ^1.9.1
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
